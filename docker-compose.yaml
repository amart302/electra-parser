x-database-url: &database-url >-
  postgresql://${DATABASE_USER:?Укажите DATABASE_USER}:${DATABASE_PASSWORD:?Укажите DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:?Укажите DATABASE_NAME}

services:
  parser:
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    env_file:
      - .env
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    environment:
      DATABASE_URL: *database-url
    command: ['npm', 'run', 'prisma:migrate:deploy']
    restart: no
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Укажите DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Укажите DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:?Укажите DATABASE_NAME}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
