services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Укажите DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Укажите DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:?Укажите DATABASE_NAME}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
